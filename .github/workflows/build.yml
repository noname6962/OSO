name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore OSO.sln --locked-mode
      - run: dotnet build OSO.sln -c Release --no-restore
      - run: dotnet test tests/Oso.Tests/Oso.Tests.csproj -c Release --no-build --no-restore
      - name: Windows PowerShell script syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Publish Windows executable
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\Publish.ps1
